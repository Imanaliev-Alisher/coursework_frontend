services:
  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: compose/Dockerfile
    container_name: aes-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_BASE_URL=http://localhost:8888/api/v1
    restart: unless-stopped
    networks:
      - aes-network

networks:
  aes-network:
    driver: bridge
